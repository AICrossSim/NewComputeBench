# Llama 3 70B bitflip-aware LoRA fine-tuning with FSDP2 on 4x B200
# Steps configurable via --steps CLI flag (default 20 for testing)
#
# nproc_per_node must equal [parallelism].fsdp_degree (4 below).
#
# Full run: ~21,000 steps (1% of 70B params = 700M tokens)
#   torchrun --nproc_per_node=4 train.py --config config_70b.toml --steps 21000

[model]
flavor = "70B"
hf_model_path = "meta-llama/Meta-Llama-3-70B"

[training]
dtype = "bfloat16"
mixed_precision_param = "bfloat16"
mixed_precision_reduce = "float32"
seq_len = 2048
local_batch_size = 2
gradient_accumulation_steps = 4
steps = 20  # override with --steps for full run
lr = 2e-4
weight_decay = 0.01
warmup_steps = 100
max_norm = 1.0
log_freq = 5
save_freq = 500
save_dir = "./checkpoints/70b_bitflip_lora"
num_workers = 4

[parallelism]
fsdp_degree = 4

[lora]
r = 32
lora_alpha = 32

[bitflip]
# Probabilities = 0.5^16 ~ 1.526e-5 for both exponent- and fraction-bit flips,
# on weights (w_*) and activations (x_*).
w_p_exp = 1.52587890625e-05
w_p_frac = 1.52587890625e-05
# zero-out thresholds set above the clean model's profiled max
# (|w| max 126.5, |x| max 3680) so only flip-corrupted blowups are clipped.
w_zero_out_t = 256.0
x_p_exp = 1.52587890625e-05
x_p_frac = 1.52587890625e-05
x_zero_out_t = 8192.0
# Single base_seed; per-component seeds (w/x_seed_exp/frac) are derived internally.
base_seed = 0
skip_patterns = ["output"]

[dataset]
# Local snapshot path avoids re-downloading (~2.5GB of parquet files)
name = "/data/models/zz7522/datasets--Cheng98--fineweb-edu-1.25B/snapshots/ded284806aa214b59076a66f63210ba784f6ab28"
split = "train"
text_field = "text"
